name: Build and deploy Mini-Nils

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mininils-deploy-${{ github.repository }}
  cancel-in-progress: true

# Only non-secret repository variables here. Secrets are passed to the one
# step that needs them.
env:
  AGENT_NAME: ${{ vars.AGENT_NAME }}
  AGENT_MENTION: ${{ vars.AGENT_MENTION }}
  CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}

jobs:
  deploy:
    name: Bootstrap, build, and deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate repository settings
        id: settings
        shell: bash
        run: |
          set -euo pipefail
          source scripts/agent-identity.sh
          # The first push (gh repo create --push) happens before the
          # repository settings exist. Skip quietly instead of failing.
          if [[ -z "${AGENT_NAME:-}" ]]; then
            echo "::notice::AGENT_NAME is not set. Deploy skipped."
            {
              echo "### Mini-Nils deployment skipped"
              echo
              echo "The repository variable \`AGENT_NAME\` is not set yet."
              echo "Add the repository secrets and \`AGENT_NAME\`, then run this workflow again (Run workflow)."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          agent_label="$(agent_label_from_name "$AGENT_NAME")"
          if [[ ! "$agent_label" =~ ^[a-z0-9][a-z0-9._-]*$ ]]; then
            echo "AGENT_NAME produces an invalid image namespace: $agent_label" >&2
            exit 1
          fi
          if [[ "$agent_label" == "agent" || "$agent_label" == "mini-nils" ]]; then
            echo "AGENT_NAME produces a shared label; choose your own participant name." >&2
            exit 1
          fi
          name="$(agent_resource_suffix "$AGENT_NAME")"
          if [[ ! "$name" =~ ^[a-z][a-z0-9-]{2,11}$ ]]; then
            echo "AGENT_NAME must normalize to 3-12 lowercase Azure-safe characters: $name" >&2
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Log in to Azure
        if: steps.settings.outputs.configured == 'true'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Bootstrap, build, and deploy Azure resources
        if: steps.settings.outputs.configured == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          bash .github/deploy-azure.sh

          {
            echo "### Mini-Nils deployment"
            echo
            echo "- Receiver URL: \`$(jq -r '.receiverUrl.value' .deploy-outputs.json)\`"
            echo "- Receiver: \`$(jq -r '.receiverName.value' .deploy-outputs.json)\`"
            echo "- Worker job: \`$(jq -r '.workerJobName.value' .deploy-outputs.json)\`"
            echo "- Issue label: \`$(source scripts/agent-identity.sh; agent_label_from_name "$AGENT_NAME")\`"
            echo "- Azure suffix: \`$(source scripts/agent-identity.sh; agent_resource_suffix "$AGENT_NAME")\`"
            echo "- Resource group: \`rg-agentic-workshop\`"
          } >> "$GITHUB_STEP_SUMMARY"
